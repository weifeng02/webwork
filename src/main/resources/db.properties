# 数据库配置文件（db.properties）
# 配置 MySQL 数据库连接信息
# 生产环境建议使用环境变量（SUPABASE_DB_URL / SUPABASE_DB_USER / SUPABASE_DB_PASSWORD）
# 或从 MySQL 数据库连接池（如 HikariCP）中管理连接

# MySQL JDBC URL：协议 + 主机 + 端口 + 数据库名 + 时区参数
# 参数说明：useSSL=false（开发环境禁用 SSL）、serverTimezone=UTC（时区设置）、
#          allowPublicKeyRetrieval=true（允许公钥检索，用于本地开发）
db.url=jdbc:mysql://localhost:3306/lostfound?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 数据库用户名（MySQL 默认 root，建议创建独立应用账号）
db.user=root

# 数据库密码（生产环境必须配置强密码，切勿提交明文密码到代码仓库）
db.password=your_password
